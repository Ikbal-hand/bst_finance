name: bst_finance
description: "Aplikasi Keuangan CV. Berkarya Satu Tujuan"
publish_to: 'none' 

version: 1.0.0+1

environment:
  sdk: ^3.10.4

dependencies:
  flutter:
    sdk: flutter

  # Icon Bawaan
  cupertino_icons: ^1.0.2

  # --- 1. FIREBASE (Backend) ---
  firebase_core: ^2.24.2      # Wajib untuk koneksi
  firebase_auth: ^4.16.0      # Untuk Login & Role
  cloud_firestore: ^4.14.0    # Database Keuangan
  firebase_storage: ^11.5.2   # Untuk upload foto bukti transaksi

  # --- 2. STATE MANAGEMENT & ARCHITECTURE ---
  flutter_bloc: ^8.1.3        # Manajemen State (Sangat stabil untuk Enterprise)
  equatable: ^2.0.5           # Mempermudah logic di BLoC
  get_it: ^7.6.0              # Dependency Injection (Agar kode rapi)

  # --- 3. UI & UTILITIES ---
  google_fonts: ^6.1.0        # Agar font terlihat modern (Poppins/Inter)
  intl: ^0.19.0               # Wajib untuk format "Rp 1.000.000" dan Tanggal
  uuid: ^4.2.2                # Membuat ID Transaksi unik
  flutter_svg: ^2.0.9         # Icon vector (tajam di Tablet)
  fl_chart: ^0.66.0           # Untuk Grafik Keuangan di Dashboard

  # --- 4. PAYROLL & EXPORT ---
  pdf: ^3.10.7                # Membuat file PDF Slip Gaji
  printing: ^5.11.0           # Helper PDF
  path_provider: ^2.1.2       # Akses folder HP untuk simpan sementara
  share_plus: ^7.2.2          # Fitur "Share to WhatsApp"

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  
  # Aset gambar (Logo, dll)
  # Pastikan nanti buat folder 'assets/images/' di root project
  assets:
     - assets/images/